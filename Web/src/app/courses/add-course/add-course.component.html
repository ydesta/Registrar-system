<div class="content-container">
  <div class="header-section">
    <button nz-button nzType="default" class="back-btn" type="button" routerLink="../course">
      <span nz-icon nzType="arrow-left" nzTheme="outline"></span>
      Back to Courses
    </button>
    <div class="header-content">
      <div class="page-title">
        <h2 class="title-text">{{ action }}</h2>
        <p class="subtitle-text">Add or update course information</p>
      </div>
    </div>
  </div>

  <div class="form-container">
    <div class="form-card">
      <div class="form-header">
        <div class="form-icon">
          <span nz-icon nzType="book" nzTheme="outline"></span>
        </div>
        <div class="form-title">
          <h3>Course Information</h3>
          <p>Please fill in the course details below</p>
        </div>
      </div>

      <form
        nz-form
        [formGroup]="acadamicProgramForm"
        (ngSubmit)="submitForm()"
        class="admin-form"
      >
        <div class="form-sections">
          <div class="form-section">
            <div class="section-header">
              <h4 class="section-title">
                <span nz-icon nzType="info-circle" nzTheme="outline"></span>
                Course Details
              </h4>
              <p class="section-description">Configure course code, title, and hour specifications</p>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzValidatingTip="Validating...">
                    <input
                      nz-input
                      id="courseCode"
                      formControlName="courseCode"
                      placeholder=" "
                      class="input-with-floating-label"
                    />
                    <label for="courseCode" class="floating-label">
                      <span nz-icon nzType="barcode" nzTheme="outline"></span>
                      Course Code <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>

              <div class="form-col">
                <nz-form-item>
                  <nz-form-control>
                    <input
                      nz-input
                      id="courseTitle"
                      formControlName="courseTitle"
                      placeholder=" "
                      class="input-with-floating-label"
                    />
                    <label for="courseTitle" class="floating-label">
                      <span nz-icon nzType="edit" nzTheme="outline"></span>
                      Course Title <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control>
                    <input
                      nz-input
                      id="creditHours"
                      formControlName="creditHours"
                      type="number"
                      placeholder=" "
                      class="input-with-floating-label"
                    />
                    <label for="creditHours" class="floating-label">
                      <span nz-icon nzType="number" nzTheme="outline"></span>
                      Credit Hours <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>

              <div class="form-col">
                <nz-form-item>
                  <nz-form-control>
                    <input
                      nz-input
                      id="lectureHours"
                      formControlName="lectureHours"
                      type="number"
                      placeholder=" "
                      class="input-with-floating-label"
                    />
                    <label for="lectureHours" class="floating-label">
                      <span nz-icon nzType="field-time" nzTheme="outline"></span>
                      Lecture Hours <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control>
                    <input
                      nz-input
                      id="labHours"
                      formControlName="labHours"
                      type="number"
                      placeholder=" "
                      class="input-with-floating-label"
                    />
                    <label for="labHours" class="floating-label">
                      <span nz-icon nzType="experiment" nzTheme="outline"></span>
                      Lab Hours <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>

              <div class="form-col">
                <nz-form-item>
                  <nz-form-control>
                    <input
                      nz-input
                      id="remark"
                      formControlName="remark"
                      placeholder=" "
                      class="input-with-floating-label"
                    />
                    <label for="remark" class="floating-label">
                      <span nz-icon nzType="form" nzTheme="outline"></span>
                      Remark
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button
            nz-button
            nzType="default"
            class="cancel-btn"
            type="button"
            routerLink="../course"
          >
            <span nz-icon nzType="close" nzTheme="outline"></span>
            Cancel
          </button>
          <button nz-button nzType="primary" class="submit-btn" type="submit">
            <span nz-icon nzType="save" nzTheme="outline"></span>
            {{ submit }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
