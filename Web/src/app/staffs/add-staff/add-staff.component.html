<div class="content-container">
  <div class="header-section">
    <button
      routerLink="../staffs"
      nz-button
      nzType="default"
      class="back-btn"
      type="button"
    >
      <span nz-icon nzType="arrow-left" nzTheme="outline"></span>
      Back to Staffs
    </button>
    <div class="header-content">
      <div class="page-title">
        <h2 class="title-text">{{ action }}</h2>
        <p class="subtitle-text">Add or update staff information</p>
      </div>
    </div>
  </div>

  <div class="form-container">
    <div class="form-card">
      <div class="form-header">
        <div class="form-icon">
          <span nz-icon nzType="user-add" nzTheme="outline"></span>
        </div>
        <div class="form-title">
          <h3>Staff Information</h3>
          <p>Configure staff profile and employment details</p>
        </div>
      </div>

      <form
        nz-form
        [formGroup]="staffForm"
        (ngSubmit)="submitForm()"
        class="admin-form"
      >
        <div class="form-sections">
          <div class="form-section">
            <div class="section-header">
              <h4 class="section-title">
                <span nz-icon nzType="idcard" nzTheme="outline"></span>
                Personal & contact
              </h4>
              <p class="section-description">Name, demographics, and how to reach this staff member</p>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzErrorTip="Please select a title">
                    <nz-select
                      formControlName="title"
                      id="title"
                      nzPlaceHolder=" "
                      class="select-with-floating-label"
                      [nzShowSearch]="true"
                      [nzShowArrow]="true"
                      [nzDropdownMatchSelectWidth]="false"
                    >
                      <nz-option
                        *ngFor="let title of instructorTitles"
                        [nzValue]="title.Id"
                        [nzLabel]="title.Description"
                      ></nz-option>
                    </nz-select>
                    <label for="title" class="floating-label">
                      <span nz-icon nzType="user" nzTheme="outline"></span>
                      Title <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzErrorTip="Please enter first name">
                    <input
                      nz-input
                      id="firstName"
                      formControlName="firstName"
                      placeholder=" "
                      class="input-with-floating-label"
                    />
                    <label for="firstName" class="floating-label">
                      <span nz-icon nzType="user" nzTheme="outline"></span>
                      First Name <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control>
                    <input
                      nz-input
                      id="middleName"
                      formControlName="middleName"
                      placeholder=" "
                      class="input-with-floating-label"
                    />
                    <label for="middleName" class="floating-label">
                      <span nz-icon nzType="user" nzTheme="outline"></span>
                      Middle Name
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzErrorTip="Please enter last name">
                    <input
                      nz-input
                      id="lastName"
                      formControlName="lastName"
                      placeholder=" "
                      class="input-with-floating-label"
                    />
                    <label for="lastName" class="floating-label">
                      <span nz-icon nzType="user" nzTheme="outline"></span>
                      Last Name <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control>
                    <nz-select
                      formControlName="gender"
                      id="gender"
                      nzPlaceHolder=" "
                      class="select-with-floating-label"
                      [nzShowArrow]="true"
                      [nzDropdownMatchSelectWidth]="false"
                    >
                      <nz-option nzValue="Male" nzLabel="Male"></nz-option>
                      <nz-option nzValue="Female" nzLabel="Female"></nz-option>
                      <nz-option nzValue="Other" nzLabel="Other"></nz-option>
                    </nz-select>
                    <label for="gender" class="floating-label">
                      <span nz-icon nzType="team" nzTheme="outline"></span>
                      Gender
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control>
                    <nz-date-picker
                      formControlName="birthDate"
                      id="birthDate"
                      nzPlaceHolder=" "
                      nzAllowClear
                      class="date-with-floating-label"
                    ></nz-date-picker>
                    <label for="birthDate" class="floating-label">
                      <span nz-icon nzType="calendar" nzTheme="outline"></span>
                      Birth Date
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control>
                    <nz-select
                      formControlName="nationality"
                      id="nationality"
                      nzPlaceHolder=" "
                      class="select-with-floating-label"
                      [nzShowSearch]="true"
                      [nzShowArrow]="true"
                      [nzAllowClear]="true"
                      [nzFilterOption]="filterNationality"
                      [nzDropdownMatchSelectWidth]="false"
                    >
                      <nz-option
                        *ngFor="let country of countries"
                        [nzValue]="country.nationality"
                        [nzLabel]="country.name + ' (' + country.nationality + ')'"
                      ></nz-option>
                    </nz-select>
                    <label for="nationality" class="floating-label">
                      <span nz-icon nzType="global" nzTheme="outline"></span>
                      Nationality
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
              <div class="form-col"></div>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzErrorTip="Please enter mobile number">
                    <input
                      nz-input
                      id="mobile"
                      formControlName="mobile"
                      placeholder=" "
                      class="input-with-floating-label"
                      (blur)="onPhoneBlur()"
                    />
                    <label for="mobile" class="floating-label">
                      <span nz-icon nzType="phone" nzTheme="outline"></span>
                      Mobile <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzErrorTip="Please enter email">
                    <input
                      nz-input
                      id="email"
                      formControlName="email"
                      placeholder=" "
                      class="input-with-floating-label"
                      type="email"
                    />
                    <label for="email" class="floating-label">
                      <span nz-icon nzType="mail" nzTheme="outline"></span>
                      Email <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzErrorTip="Please select employment type">
                    <nz-select
                      formControlName="employmentType"
                      id="employmentType"
                      nzPlaceHolder=" "
                      class="select-with-floating-label"
                      [nzShowSearch]="true"
                      [nzShowArrow]="true"
                      [nzDropdownMatchSelectWidth]="false"
                    >
                      <nz-option
                        *ngFor="let type of employmentTypes"
                        [nzValue]="type.Id"
                        [nzLabel]="type.Description"
                      ></nz-option>
                    </nz-select>
                    <label for="employmentType" class="floating-label">
                      <span nz-icon nzType="solution" nzTheme="outline"></span>
                      Employment Type <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
              <div class="form-col"></div>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button
            nz-button
            nzType="default"
            class="cancel-btn"
            type="button"
            [disabled]="isSubmitting"
            (click)="cancel()"
          >
            <span nz-icon nzType="close" nzTheme="outline"></span>
            Cancel
          </button>
          <button
            nz-button
            nzType="primary"
            class="submit-btn"
            type="submit"
            [nzLoading]="isSubmitting"
            [disabled]="isSubmitting || staffForm.invalid"
          >
            <span nz-icon nzType="save" nzTheme="outline"></span>
            {{ submit }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
