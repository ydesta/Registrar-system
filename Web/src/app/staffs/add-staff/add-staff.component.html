<div class="content-container">
  <div class="header-section">
    <button
      routerLink="../staffs"
      nz-button
      nzType="default"
      class="back-btn"
      type="button"
    >
      <span nz-icon nzType="arrow-left" nzTheme="outline"></span>
      Back to Staffs
    </button>
    <div class="header-content">
      <div class="page-title">
        <h2 class="title-text">{{ action }}</h2>
        <p class="subtitle-text">Add or update staff information</p>
      </div>
    </div>
  </div>

  <div class="form-container">
    <div class="form-card">
      <div class="form-header">
        <div class="form-icon">
          <span nz-icon nzType="user-add" nzTheme="outline"></span>
        </div>
        <div class="form-title">
          <h3>Staff Information</h3>
          <p>Configure staff profile and employment details</p>
        </div>
      </div>

      <form
        nz-form
        nzLayout="vertical"
        [formGroup]="staffForm"
        (ngSubmit)="submitForm()"
        class="staff-form"
      >
        <div class="form-sections">
          <div class="form-section">
            <div class="section-header">
              <h4 class="section-title">
                <span nz-icon nzType="idcard" nzTheme="outline"></span>
                Personal & contact
              </h4>
              <p class="section-description">Name, demographics, and how to reach this staff member</p>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-label nzRequired>Title</nz-form-label>
                  <nz-form-control>
                    <nz-select
                      formControlName="title"
                      nzPlaceHolder="Select title"
                      [nzShowSearch]="true"
                      [nzShowArrow]="true"
                      [nzDropdownMatchSelectWidth]="false"
                      class="professional-select"
                    >
                      <nz-option
                        *ngFor="let title of instructorTitles"
                        [nzValue]="title.Id"
                        [nzLabel]="title.Description"
                      ></nz-option>
                    </nz-select>
                  </nz-form-control>
                </nz-form-item>
              </div>
              <div class="form-col">
                <nz-form-item>
                  <nz-form-label nzRequired>First Name</nz-form-label>
                  <nz-form-control>
                    <input
                      nz-input
                      formControlName="firstName"
                      class="form-input"
                      placeholder="Enter first name"
                    />
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-label nzRequired>Last Name</nz-form-label>
                  <nz-form-control>
                    <input
                      nz-input
                      formControlName="lastName"
                      class="form-input"
                      placeholder="Enter last name"
                    />
                  </nz-form-control>
                </nz-form-item>
              </div>
              <div class="form-col">
                <nz-form-item>
                  <nz-form-label>Gender</nz-form-label>
                  <nz-form-control>
                    <nz-select
                      formControlName="gender"
                      nzPlaceHolder="Select gender"
                      [nzShowArrow]="true"
                      [nzDropdownMatchSelectWidth]="false"
                      class="professional-select"
                    >
                      <nz-option nzValue="Male" nzLabel="Male"></nz-option>
                      <nz-option nzValue="Female" nzLabel="Female"></nz-option>
                      <nz-option nzValue="Other" nzLabel="Other"></nz-option>
                    </nz-select>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-label>Birth Date</nz-form-label>
                  <nz-form-control>
                    <nz-date-picker
                      formControlName="birthDate"
                      nzPlaceHolder="Select birth date"
                      nzAllowClear
                      class="ant-calendar-picker"
                      style="width: 100%"
                    ></nz-date-picker>
                  </nz-form-control>
                </nz-form-item>
              </div>
              <div class="form-col">
                <nz-form-item>
                  <nz-form-label>Nationality</nz-form-label>
                  <nz-form-control>
                    <input
                      nz-input
                      formControlName="nationality"
                      class="form-input"
                      placeholder="Enter nationality"
                    />
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-label nzRequired>Mobile</nz-form-label>
                  <nz-form-control>
                    <input
                      nz-input
                      formControlName="mobile"
                      class="form-input"
                      placeholder="Enter mobile number"
                    />
                  </nz-form-control>
                </nz-form-item>
              </div>
              <div class="form-col">
                <nz-form-item>
                  <nz-form-label nzRequired>Email</nz-form-label>
                  <nz-form-control>
                    <input
                      nz-input
                      formControlName="email"
                      class="form-input"
                      placeholder="Enter email address"
                      type="email"
                    />
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>

            <div class="form-row form-row-full">
              <div class="form-col form-col-full">
                <nz-form-item>
                  <nz-form-label nzRequired>Employment Type</nz-form-label>
                  <nz-form-control>
                    <nz-select
                      formControlName="employmentType"
                      nzPlaceHolder="Select employment type"
                      [nzShowSearch]="true"
                      [nzShowArrow]="true"
                      [nzDropdownMatchSelectWidth]="false"
                      class="professional-select"
                    >
                      <nz-option
                        *ngFor="let type of employmentTypes"
                        [nzValue]="type.Id"
                        [nzLabel]="type.Description"
                      ></nz-option>
                    </nz-select>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button
            nz-button
            nzType="default"
            class="cancel-btn"
            type="button"
            routerLink="../staffs"
          >
            <span nz-icon nzType="close" nzTheme="outline"></span>
            Cancel
          </button>
          <button nz-button nzType="primary" class="submit-btn" type="submit">
            <span nz-icon nzType="save" nzTheme="outline"></span>
            {{ submit }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
