<div class="content-container">
  <div class="header-section">
    <button nz-button nzType="default" class="back-btn" type="button" (click)="goBack()">
      <span nz-icon nzType="arrow-left" nzTheme="outline"></span>
      Back to Programmes
    </button>
    <div class="header-content">
      <div class="page-title">
        <h2 class="title-text">{{ action }}</h2>
        <p class="subtitle-text">Manage academic programme information and details</p>
      </div>
    </div>
  </div>

  <div class="form-container">
    <div class="form-card">
      <div class="form-header">
        <div class="form-icon">
          <span nz-icon nzType="read" nzTheme="outline"></span>
        </div>
        <div class="form-title">
          <h3>Academic Programme Information</h3>
          <p>Fill in the required information to create or update the programme</p>
        </div>
      </div>

      <form
        nz-form
        [formGroup]="acadamicProgramForm"
        (ngSubmit)="submitForm()"
        class="admin-form"
      >
        <div class="form-sections">
          <div class="form-section">
            <div class="section-header">
              <h4 class="section-title">
                <span nz-icon nzType="book" nzTheme="outline"></span>
                Programme Details
              </h4>
              <p class="section-description">Define the programme code, title, and remarks</p>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzErrorTip="Please enter a programme code">
                    <input
                      nz-input
                      id="acadamicProgrammeCode"
                      formControlName="acadamicProgrammeCode"
                      placeholder=" "
                      class="input-with-floating-label"
                    />
                    <label for="acadamicProgrammeCode" class="floating-label">
                      <span nz-icon nzType="barcode" nzTheme="outline"></span>
                      Academic Programme Code <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>

              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzErrorTip="Please enter a programme title">
                    <input
                      nz-input
                      id="acadamicProgrammeTitle"
                      formControlName="acadamicProgrammeTitle"
                      placeholder=" "
                      class="input-with-floating-label"
                    />
                    <label for="acadamicProgrammeTitle" class="floating-label">
                      <span nz-icon nzType="book" nzTheme="outline"></span>
                      Academic Programme Title <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control>
                    <nz-textarea-count [nzMaxCharacterCount]="250">
                      <textarea
                        id="remark"
                        rows="4"
                        formControlName="remark"
                        nz-input
                        placeholder=" "
                        class="textarea-with-floating-label"
                      ></textarea>
                    </nz-textarea-count>
                    <label for="remark" class="floating-label textarea-label">
                      <span nz-icon nzType="form" nzTheme="outline"></span>
                      Remark
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button
            nz-button
            nzType="default"
            class="cancel-btn"
            type="button"
            (click)="goBack()"
          >
            <span nz-icon nzType="close" nzTheme="outline"></span>
            Cancel
          </button>
          <button
            nz-button
            nzType="primary"
            class="submit-btn"
            type="submit"
            [disabled]="!acadamicProgramForm.valid || loading"
            [nzLoading]="loading"
          >
            <span nz-icon nzType="save" nzTheme="outline"></span>
            {{ submit }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
