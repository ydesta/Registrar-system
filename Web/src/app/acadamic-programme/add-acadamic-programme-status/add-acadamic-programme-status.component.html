<div class="content-container">
  <div class="header-section">
    <button
      nz-button
      nzType="default"
      class="back-btn"
      type="button"
      routerLink="/acadamic-program/program-status"
    >
      <span nz-icon nzType="arrow-left" nzTheme="outline"></span>
      Back to Programme Status
    </button>
    <div class="header-content">
      <div class="page-title">
        <h2 class="title-text">{{ action }}</h2>
        <p class="subtitle-text">Set or update academic programme status</p>
      </div>
    </div>
  </div>

  <div class="form-container">
    <div class="form-card">
      <div class="form-header">
        <div class="form-icon">
          <span nz-icon nzType="flag" nzTheme="outline"></span>
        </div>
        <div class="form-title">
          <h3>Programme Status Information</h3>
          <p>Record the programme status and effective date</p>
        </div>
      </div>

      <form
        nz-form
        [formGroup]="acadamicProgramStatusForm"
        (ngSubmit)="submitForm()"
        class="admin-form"
      >
        <div class="form-sections">
          <div class="form-section">
            <div class="section-header">
              <h4 class="section-title">
                <span nz-icon nzType="info-circle" nzTheme="outline"></span>
                Status Details
              </h4>
              <p class="section-description">Select the programme, status, and effective date</p>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzErrorTip="Please select an academic programme">
                    <nz-select
                      formControlName="acadamicProgrammeCode"
                      id="acadamicProgrammeCode"
                      nzPlaceHolder=" "
                      class="select-with-floating-label"
                      [nzShowSearch]="true"
                    >
                      <nz-option
                        *ngFor="let item of acadamicPrograms"
                        [nzValue]="item.acadamicProgrammeCode"
                        [nzLabel]="item.acadamicProgrammeTitle"
                      ></nz-option>
                    </nz-select>
                    <label for="acadamicProgrammeCode" class="floating-label">
                      <span nz-icon nzType="book" nzTheme="outline"></span>
                      Academic Programme <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>

              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzErrorTip="Please select a status">
                    <nz-select
                      formControlName="status"
                      id="status"
                      nzPlaceHolder=" "
                      class="select-with-floating-label"
                    >
                      <nz-option nzValue="Active" nzLabel="Active"></nz-option>
                      <nz-option nzValue="Pending" nzLabel="Pending"></nz-option>
                      <nz-option nzValue="Retired" nzLabel="Retired"></nz-option>
                    </nz-select>
                    <label for="status" class="floating-label">
                      <span nz-icon nzType="flag" nzTheme="outline"></span>
                      Academic Programme Status <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzErrorTip="Please select a date">
                    <nz-date-picker
                      formControlName="date"
                      id="date"
                      nzPlaceHolder=" "
                      class="date-with-floating-label"
                    ></nz-date-picker>
                    <label for="date" class="floating-label">
                      <span nz-icon nzType="calendar" nzTheme="outline"></span>
                      Date <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
              <div class="form-col"></div>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control>
                    <nz-textarea-count [nzMaxCharacterCount]="250">
                      <textarea
                        id="remark"
                        rows="4"
                        formControlName="remark"
                        nz-input
                        placeholder=" "
                        class="textarea-with-floating-label"
                      ></textarea>
                    </nz-textarea-count>
                    <label for="remark" class="floating-label textarea-label">
                      <span nz-icon nzType="form" nzTheme="outline"></span>
                      Remark
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button
            nz-button
            nzType="default"
            class="cancel-btn"
            type="button"
            routerLink="/acadamic-program/program-status"
          >
            <span nz-icon nzType="close" nzTheme="outline"></span>
            Cancel
          </button>
          <button
            nz-button
            nzType="primary"
            class="submit-btn"
            type="submit"
            [disabled]="acadamicProgramStatusForm.invalid"
          >
            <span nz-icon nzType="save" nzTheme="outline"></span>
            {{ submit }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
