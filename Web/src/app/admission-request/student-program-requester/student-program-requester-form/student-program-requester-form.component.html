<div class="academic-program-form-container">
  <!-- Form Header -->
  <div class="form-header">
    <div class="header-icon">
      <i nz-icon nzType="read" nzTheme="outline"></i>
    </div>
    <div class="header-content">
      <h2 class="form-title">Academic Program Request</h2>
      <p class="form-subtitle">Select your preferred academic program and division</p>
    </div>
  </div>

  <!-- Form Content -->
  <form nz-form [formGroup]="academicProgramRequestForm" class="academic-program-form">
    
    <!-- Academic Programme Field -->
    <nz-form-item>
      <nz-form-control [nzErrorTip]="academicProgrammeErrorTpl">
        <nz-select 
          formControlName="acadamicProgrammeId" 
          placeholder=" "
          id="acadamicProgrammeId"
          class="select-with-floating-label"
          nzShowSearch="true" 
          nzAllowClear="true">
          <nz-option 
            *ngFor="let item of acadamicProgrammes" 
            [nzValue]="item.id"
            [nzLabel]="item.acadamicProgrammeTitle">
          </nz-option>
        </nz-select>
        <label for="acadamicProgrammeId" class="floating-label">
          <i nz-icon nzType="book" nzTheme="outline"></i>
          Academic Programme <span class="required">*</span>
        </label>
        <ng-template #academicProgrammeErrorTpl let-control>
          <div class="error-message" *ngIf="control.hasError('required')">
            <i nz-icon nzType="exclamation-circle" nzTheme="fill"></i>
            Academic Programme is required
          </div>
        </ng-template>
      </nz-form-control>
    </nz-form-item>

    <!-- Division Field -->
    <nz-form-item>
      <nz-form-control [nzErrorTip]="divisionErrorTpl">
        <nz-select 
          formControlName="division" 
          placeholder=" "
          id="division"
          class="select-with-floating-label"
          nzShowSearch="true" 
          nzAllowClear="true">
          <nz-option 
            *ngFor="let item of divisionStatusist" 
            [nzValue]="item.Id"
            [nzLabel]="item.Description">
          </nz-option>
        </nz-select>
        <label for="division" class="floating-label">
          <i nz-icon nzType="apartment" nzTheme="outline"></i>
          Division <span class="required">*</span>
        </label>
        <ng-template #divisionErrorTpl let-control>
          <div class="error-message" *ngIf="control.hasError('required')">
            <i nz-icon nzType="exclamation-circle" nzTheme="fill"></i>
            Division is required
          </div>
        </ng-template>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-control [nzErrorTip]="applicantYearErrorTpl">
        <nz-select
          formControlName="applicantYear"
          placeholder=" "
          id="applicantYear"
          class="select-with-floating-label"
          nzAllowClear="true">
          <nz-option
            *ngFor="let item of applicantYearOptions"
            [nzValue]="item.Id"
            [nzLabel]="item.Description">
          </nz-option>
        </nz-select>
        <label for="applicantYear" class="floating-label">
          <i nz-icon nzType="user" nzTheme="outline"></i>
          Applicant Type <span class="required">*</span>
        </label>
        <ng-template #applicantYearErrorTpl let-control>
          <div class="error-message" *ngIf="control.hasError('required')">
            <i nz-icon nzType="exclamation-circle" nzTheme="fill"></i>
            Applicant Type is required
          </div>
        </ng-template>
      </nz-form-control>
    </nz-form-item>

    <!-- Form Actions -->
    <div class="form-actions">
      <div class="action-buttons">
        <button 
          nz-button 
          nzType="default" 
          (click)="onCancel()"
          class="cancel-btn"
        >
          <i nz-icon nzType="close" nzTheme="outline"></i>
          Cancel
        </button>
        
        <button 
          nz-button 
          nzType="primary" 
          (click)="onSubmit()"
          [disabled]="academicProgramRequestForm.invalid"
          class="submit-btn"
        >
          <i nz-icon nzType="save" nzTheme="outline"></i>
          {{ id ? 'Update' : 'Save' }}
        </button>
      </div>
    </div>
  </form>
</div>
