<div class="content-container">
  <div class="header-section">
    <button
      nz-button
      nzType="default"
      class="back-btn"
      type="button"
      routerLink="/graduation/cuadrant-breakdown"
    >
      <span nz-icon nzType="arrow-left" nzTheme="outline"></span>
      Back to Quadrant Breakdown
    </button>
    <div class="header-content">
      <div class="page-title">
        <h2 class="title-text">{{ action }}</h2>
        <p class="subtitle-text">Map courses to curriculum year and term</p>
      </div>
    </div>
  </div>

  <div class="form-container">
    <div class="form-card">
      <div class="form-header">
        <div class="form-icon">
          <span nz-icon nzType="partition" nzTheme="outline"></span>
        </div>
        <div class="form-title">
          <h3>Curriculum Quadrant Breakdown</h3>
          <p>Assign courses to academic year and term</p>
        </div>
      </div>

      <form
        nz-form
        [formGroup]="acadamicProgramForm"
        (ngSubmit)="submitForm()"
        class="admin-form"
      >
        <div class="form-sections">
          <div class="form-section">
            <div class="section-header">
              <h4 class="section-title">
                <span nz-icon nzType="info-circle" nzTheme="outline"></span>
                Breakdown Details
              </h4>
              <p class="section-description">Curriculum, courses, year, and term</p>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzErrorTip="Please select a curriculum">
                    <nz-select
                      formControlName="CurriculumId"
                      id="CurriculumId"
                      nzPlaceHolder=" "
                      class="select-with-floating-label"
                      nzShowSearch
                    >
                      <nz-option
                        *ngFor="let item of curricula"
                        [nzValue]="item.id"
                        [nzLabel]="item.curriculumCode"
                      ></nz-option>
                    </nz-select>
                    <label for="CurriculumId" class="floating-label">
                      <span nz-icon nzType="barcode" nzTheme="outline"></span>
                      Curriculum Code <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>

              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzErrorTip="Please select courses">
                    <nz-select
                      nzMode="multiple"
                      formControlName="courseId"
                      id="courseId"
                      nzPlaceHolder=" "
                      class="select-with-floating-label"
                      nzShowSearch
                      [(ngModel)]="listOfSelectedValue"
                    >
                      <nz-option
                        *ngFor="let item of courses"
                        [nzValue]="item.id"
                        [nzLabel]="item.courseTitle"
                      ></nz-option>
                    </nz-select>
                    <label for="courseId" class="floating-label">
                      <span nz-icon nzType="book" nzTheme="outline"></span>
                      Course Code <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzErrorTip="Please select a year number">
                    <nz-select
                      formControlName="yearNumber"
                      id="yearNumber"
                      nzPlaceHolder=" "
                      class="select-with-floating-label"
                    >
                      <nz-option
                        *ngFor="let item of listOfYearNumber"
                        [nzValue]="item.Id"
                        [nzLabel]="item.Description"
                      ></nz-option>
                    </nz-select>
                    <label for="yearNumber" class="floating-label">
                      <span nz-icon nzType="calendar" nzTheme="outline"></span>
                      Year Number <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>

              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzErrorTip="Please select a term number">
                    <nz-select
                      formControlName="termNumber"
                      id="termNumber"
                      nzPlaceHolder=" "
                      class="select-with-floating-label"
                    >
                      <nz-option
                        *ngFor="let item of listOfTermNumber"
                        [nzValue]="item.Id"
                        [nzLabel]="item.Description"
                      ></nz-option>
                    </nz-select>
                    <label for="termNumber" class="floating-label">
                      <span nz-icon nzType="schedule" nzTheme="outline"></span>
                      Term Number <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control>
                    <nz-textarea-count [nzMaxCharacterCount]="250">
                      <textarea
                        id="remark"
                        rows="4"
                        formControlName="remark"
                        nz-input
                        placeholder=" "
                        class="textarea-with-floating-label"
                      ></textarea>
                    </nz-textarea-count>
                    <label for="remark" class="floating-label textarea-label">
                      <span nz-icon nzType="form" nzTheme="outline"></span>
                      Remark
                    </label>
                    <div
                      nz-form-explain
                      *ngIf="remark.hasError('invalidChars') && (remark.dirty || remark.touched)"
                    >
                      <span class="error-message">{{ remark.getError('invalidChars').message }}</span>
                    </div>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button
            nz-button
            nzType="default"
            class="cancel-btn"
            type="button"
            routerLink="/graduation/cuadrant-breakdown"
          >
            <span nz-icon nzType="close" nzTheme="outline"></span>
            Cancel
          </button>
          <button
            nz-button
            nzType="primary"
            class="submit-btn"
            type="submit"
            [disabled]="!acadamicProgramForm.valid"
          >
            <span nz-icon nzType="save" nzTheme="outline"></span>
            {{ submit }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
