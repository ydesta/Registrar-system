<div class="content-container">
  <div class="header-section">
    <button
      routerLink="../quadrant"
      nz-button
      nzType="default"
      class="back-btn"
      type="button"
    >
      <span nz-icon nzType="arrow-left" nzTheme="outline"></span>
      Back to Quadrants
    </button>
    <div class="header-content">
      <div class="page-title">
        <h2 class="title-text">{{ action }}</h2>
        <p class="subtitle-text">Add or update quadrant information</p>
      </div>
    </div>
  </div>

  <div class="form-container">
    <div class="form-card">
      <div class="form-header">
        <div class="form-icon">
          <span nz-icon nzType="appstore" nzTheme="outline"></span>
        </div>
        <div class="form-title">
          <h3>Quadrant Information</h3>
          <p>Please fill in the quadrant details below</p>
        </div>
      </div>

      <form
        nz-form
        [formGroup]="acadamicProgramForm"
        (ngSubmit)="submitForm()"
        class="admin-form"
      >
        <div class="form-sections">
          <div class="form-section">
            <div class="section-header">
              <h4 class="section-title">
                <span nz-icon nzType="info-circle" nzTheme="outline"></span>
                Quadrant Details
              </h4>
              <p class="section-description">Link the quadrant to a curriculum and define its identity</p>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzErrorTip="Please select a curriculum">
                    <nz-select
                      formControlName="curriculumCode"
                      id="curriculumCode"
                      nzPlaceHolder=" "
                      class="select-with-floating-label"
                      nzShowSearch
                    >
                      <nz-option
                        *ngFor="let item of curricula"
                        [nzValue]="item.curriculumCode"
                        [nzLabel]="item.curriculumCode"
                      ></nz-option>
                    </nz-select>
                    <label for="curriculumCode" class="floating-label">
                      <span nz-icon nzType="book" nzTheme="outline"></span>
                      Curriculum <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>

              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzErrorTip="Please enter quadrant ID">
                    <input
                      nz-input
                      id="quadrantsID"
                      formControlName="quadrantsID"
                      placeholder=" "
                      class="input-with-floating-label"
                    />
                    <label for="quadrantsID" class="floating-label">
                      <span nz-icon nzType="barcode" nzTheme="outline"></span>
                      Quadrant ID <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzErrorTip="Please enter quadrant heading">
                    <input
                      nz-input
                      id="quadrantHeading"
                      formControlName="quadrantHeading"
                      placeholder=" "
                      class="input-with-floating-label"
                    />
                    <label for="quadrantHeading" class="floating-label">
                      <span nz-icon nzType="font-size" nzTheme="outline"></span>
                      Quadrant Heading <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
              <div class="form-col"></div>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control>
                    <textarea
                      nz-input
                      id="remark"
                      formControlName="remark"
                      placeholder=" "
                      class="textarea-with-floating-label"
                      rows="4"
                    ></textarea>
                    <label for="remark" class="floating-label textarea-label">
                      <span nz-icon nzType="form" nzTheme="outline"></span>
                      Remark
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button
            nz-button
            nzType="default"
            class="cancel-btn"
            type="button"
            routerLink="../quadrant"
          >
            <span nz-icon nzType="close" nzTheme="outline"></span>
            Cancel
          </button>
          <button nz-button nzType="primary" class="submit-btn" type="submit">
            <span nz-icon nzType="save" nzTheme="outline"></span>
            {{ submit }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
