<div class="search-shell">
  <div class="search-header">
    <div class="search-mark" aria-hidden="true"></div>
    <h2>{{ title }}</h2>
    <p>{{ description }}</p>
  </div>

  <form [formGroup]="searchForm" (ngSubmit)="onSubmit()" class="search-form">
    <div class="form-group">
      <label for="studentId">{{ label }}</label>
      <div class="input-row">
        <input
          type="text"
          id="studentId"
          formControlName="studentId"
          [placeholder]="placeholder"
          class="form-control"
          autocomplete="off"
          [class.error]="searchForm.get('studentId')?.invalid && searchForm.get('studentId')?.touched"
        />
        <button
          type="submit"
          class="search-btn"
          [disabled]="loading">
          <span *ngIf="!loading">{{ buttonText }}</span>
          <span *ngIf="loading">{{ loadingText }}</span>
        </button>
      </div>
      <div class="error-message" *ngIf="searchForm.get('studentId')?.invalid && searchForm.get('studentId')?.touched">
        {{ getErrorMessage() }}
      </div>
    </div>
  </form>

  <div class="error-container" *ngIf="error">
    <p>{{ error }}</p>
  </div>

  <div class="search-info" *ngIf="showInfo">
    <h4>Quick Instructions</h4>
    <div class="info-items">
      <span class="info-item">Enter the complete Student ID</span>
      <span class="info-item">Use the same ID shown on the student record</span>
      <span class="info-item">The system loads the academic profile for that student</span>
    </div>
  </div>
</div>
