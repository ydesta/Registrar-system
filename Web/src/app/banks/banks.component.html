<div class="content-container">
  <div class="header-section">
    <div class="header-content">
      <div class="page-title">
        <h2 class="title-text">Banks</h2>
        <p class="subtitle-text">View, search, and manage all banks in the system</p>
      </div>
      <div class="header-actions">
        <div class="search-section floating-label-container">
          <input
            type="text"
            nz-input
            id="bankSearch"
            class="input-with-floating-label"
            placeholder=" "
            [(ngModel)]="pager.searchKey"
            (ngModelChange)="pager.onSearch($event)"
          />
          <label for="bankSearch" class="floating-label">
            <span nz-icon nzType="search" nzTheme="outline"></span>
            Search
          </label>
        </div>
        <button nz-button nzType="primary" routerLink="../banks/add-bank/null" class="add-btn">
          <span nz-icon nzType="plus" nzTheme="outline"></span>
          Add Bank
        </button>
      </div>
    </div>
  </div>

  <div class="table-card">
    <div id="print-section">
      <nz-table
        #basicTable
        [nzData]="banks!"
        nzBordered
        [nzPageSize]="pager.pageSize"
        [nzPageSizeOptions]="pager.pageSizeOptions"
        [nzShowSizeChanger]="true"
        [nzTotal]="pager.total"
        [nzPageIndex]="pager.pageIndex"
        (nzPageIndexChange)="pager.onPageIndexChange($event)"
        (nzPageSizeChange)="pager.onPageSizeChange($event)"
        [nzFrontPagination]="false"
        [nzLoading]="pager.loading"
        [nzNoResult]="emptyTpl"
        class="banks-table"
      >
        <thead>
          <tr>
            <th style="min-width: 60px;">S/N</th>
            <th style="min-width: 200px;" [nzSortFn]="true" (nzSortOrderChange)="pager.onSort($event, 'BankName')">Bank Name</th>
            <th style="min-width: 120px;" [nzSortFn]="true" (nzSortOrderChange)="pager.onSort($event, 'CreatedDate')">Created Date</th>
            <th class="action-column">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let data of basicTable.data; let i = index">
            <td><span class="sn-badge">{{ pager.serial(i) }}</span></td>
            <td>{{ data.bankName }}</td>
            <td>{{ data.createdDate | date:'dd-MM-yyyy' }}</td>
            <td class="action-column">
              <button
                nz-button
                nz-dropdown
                [nzDropdownMenu]="menu"
                nzPlacement="bottomRight"
                class="action-button"
              >
                <span nz-icon nzType="more" nzTheme="outline"></span>
              </button>
              <nz-dropdown-menu #menu="nzDropdownMenu">
                <ul nz-menu>
                  <li nz-menu-item>
                    <a routerLink="../banks/add-bank/{{ data.id }}" class="action-item edit">
                      <span nz-icon nzType="edit" nzTheme="outline"></span>
                      <span>Edit</span>
                    </a>
                  </li>
                  <li nz-menu-item>
                    <a class="action-item delete" (click)="showDeleteConfirm(data.id)">
                      <span nz-icon nzType="delete" nzTheme="outline"></span>
                      <span>Delete</span>
                    </a>
                  </li>
                </ul>
              </nz-dropdown-menu>
            </td>
          </tr>
        </tbody>
        <ng-template #emptyTpl>
          <div class="no-data">
            <span nz-icon nzType="bank" nzTheme="outline"></span>
            <p>No banks available</p>
          </div>
        </ng-template>
      </nz-table>
    </div>
  </div>
</div>
