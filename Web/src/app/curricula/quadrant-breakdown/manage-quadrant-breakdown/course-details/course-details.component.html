<nz-table
  #courseTable
  [nzData]="courses || []"
  nzBordered
  [nzShowPagination]="false"
  [nzSize]="'small'"
  [nzNoResult]="emptyCourses"
>
  <thead>
    <tr>
      <th nzWidth="64px">S/N</th>
      <th>Course Code</th>
      <th>Course Title</th>
      <th nzWidth="120px">Credit Hours</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let course of courseTable.data; let i = index">
      <td>{{ i + 1 }}</td>
      <td>{{ course.courseCode }}</td>
      <td>{{ course.courseTitle }}</td>
      <td>{{ course.creditHours }}</td>
    </tr>
  </tbody>
  <tfoot *ngIf="courses?.length">
    <tr>
      <td></td>
      <td></td>
      <td>Total Credit Hours</td>
      <td>{{ calculateTotalCreditHours() }}</td>
    </tr>
  </tfoot>
  <ng-template #emptyCourses>
    <span>No courses assigned to this quadrant</span>
  </ng-template>
</nz-table>
