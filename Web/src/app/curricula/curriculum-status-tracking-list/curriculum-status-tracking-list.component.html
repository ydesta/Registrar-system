<div class="status-tracking-modal">
  <div class="table-responsive">
    <nz-table
      #basicTable
      [nzData]="curriculumStatusTrackingLists"
      [nzLoading]="loading"
      [nzFrontPagination]="false"
      [nzShowPagination]="false"
      [nzNoResult]="emptyTpl"
      nzBordered
      class="responsive-table"
    >
      <thead>
        <tr>
          <th style="min-width: 60px;">S/N</th>
          <th style="min-width: 160px;">Previous Status</th>
          <th style="min-width: 160px;">Current Status</th>
          <th style="min-width: 180px;">Action Date</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let data of basicTable.data; let i = index">
          <td><span class="sn-badge">{{ i + 1 }}</span></td>
          <td>
            <span [ngClass]="statusClass(data.previousStatus)">
              {{ getCurriculumStatusDescription(data.previousStatus) || "—" }}
            </span>
          </td>
          <td>
            <span [ngClass]="statusClass(data.currentStatus)">
              {{ getCurriculumStatusDescription(data.currentStatus) || "—" }}
            </span>
          </td>
          <td>{{ data.actionDate | date: "dd-MMM-yyyy HH:mm" }}</td>
        </tr>
      </tbody>
    </nz-table>
  </div>

  <ng-template #emptyTpl>
    <div class="no-data">
      <span nz-icon nzType="history" nzTheme="outline"></span>
      <p>No status tracking records found</p>
    </div>
  </ng-template>
</div>
