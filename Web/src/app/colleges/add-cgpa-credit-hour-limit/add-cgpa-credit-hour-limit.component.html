<div class="limit-form">
  <form nz-form nzLayout="vertical" [formGroup]="form" (ngSubmit)="submitForm()">
    <div class="form-grid">
      <div class="form-field full">
        <nz-form-item>
          <nz-form-label nzRequired>Level</nz-form-label>
          <nz-form-control nzErrorTip="Please select a level">
            <nz-select
              formControlName="limitLevel"
              nzPlaceHolder="Select level"
              [nzShowSearch]="true"
              [nzShowArrow]="true"
            >
              <nz-option
                *ngFor="let item of levelList"
                [nzValue]="item.Id"
                [nzLabel]="item.Description"
              ></nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </div>

      <div class="form-field full" *ngIf="isStudentLevel">
        <nz-form-item>
          <nz-form-label nzRequired>Student</nz-form-label>
          <nz-form-control nzErrorTip="Please select a student">
            <nz-select
              formControlName="studentId"
              nzPlaceHolder="Search student by ID or name"
              nzShowSearch
              nzServerSearch
              [nzShowArrow]="true"
              [nzLoading]="loadingStudents"
              (nzOnSearch)="onSearchStudent($event)"
            >
              <nz-option
                *ngFor="let item of students"
                [nzValue]="item.id"
                [nzLabel]="studentLabel(item)"
              ></nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </div>

      <div class="form-field full" *ngIf="isBatchLevel">
        <nz-form-item>
          <nz-form-label nzRequired>Batch Code</nz-form-label>
          <nz-form-control nzErrorTip="Please select a batch">
            <nz-select formControlName="batchCode" nzPlaceHolder="Select batch" nzShowSearch [nzShowArrow]="true">
              <nz-option
                *ngFor="let item of batches"
                [nzValue]="item.batchCode"
                [nzLabel]="item.batchCode"
              ></nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </div>

      <ng-container *ngIf="isTermLevel">
        <div class="form-field">
          <nz-form-item>
            <nz-form-label nzRequired>Academic Term</nz-form-label>
            <nz-form-control nzErrorTip="Please select a term">
              <nz-select formControlName="academicTerm" nzPlaceHolder="Select term" nzShowSearch [nzShowArrow]="true">
                <nz-option
                  *ngFor="let item of termList"
                  [nzValue]="item.Id"
                  [nzLabel]="item.Description"
                ></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>
        <div class="form-field">
          <nz-form-item>
            <nz-form-label nzRequired>Year</nz-form-label>
            <nz-form-control nzErrorTip="Please select a year">
              <nz-select formControlName="year" nzPlaceHolder="Select year" nzShowSearch [nzShowArrow]="true">
                <nz-option *ngFor="let y of yearOptions" [nzValue]="y" [nzLabel]="'' + y"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>
      </ng-container>

      <div class="form-field">
        <nz-form-item>
          <nz-form-label nzRequired>Min CGPA</nz-form-label>
          <nz-form-control nzErrorTip="Enter a value between 0 and 4">
            <nz-input-number
              formControlName="minCgpa"
              [nzMin]="0"
              [nzMax]="4"
              [nzStep]="0.01"
              [nzPrecision]="2"
              [nzPlaceHolder]="'0.00'"
            ></nz-input-number>
          </nz-form-control>
        </nz-form-item>
      </div>

      <div class="form-field">
        <nz-form-item>
          <nz-form-label nzRequired>Max Credit Hours</nz-form-label>
          <nz-form-control nzErrorTip="Enter credit hours">
            <nz-input-number
              formControlName="maxCreditHours"
              [nzMin]="1"
              [nzMax]="40"
              [nzStep]="1"
              [nzPlaceHolder]="'0'"
            ></nz-input-number>
          </nz-form-control>
        </nz-form-item>
      </div>

      <div class="form-field">
        <nz-form-item>
          <nz-form-label>Active</nz-form-label>
          <nz-form-control>
            <div class="switch-row">
              <nz-switch formControlName="isActive"></nz-switch>
              <span class="switch-text">{{ form.get('isActive')?.value ? 'Enabled' : 'Disabled' }}</span>
            </div>
          </nz-form-control>
        </nz-form-item>
      </div>

      <div class="form-field full">
        <nz-form-item>
          <nz-form-label>Remark</nz-form-label>
          <nz-form-control>
            <textarea
              nz-input
              formControlName="remark"
              rows="3"
              placeholder="Optional note"
            ></textarea>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>

    <div class="form-actions">
      <button nz-button nzType="default" type="button" (click)="cancel()">Cancel</button>
      <button nz-button nzType="primary" type="submit" [disabled]="form.invalid">{{ submit }}</button>
    </div>
  </form>
</div>
