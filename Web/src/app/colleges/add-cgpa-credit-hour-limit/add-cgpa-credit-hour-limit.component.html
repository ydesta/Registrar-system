<form nz-form [formGroup]="form" (ngSubmit)="submitForm()" class="admin-form">
  <div class="form-sections">
    <div class="form-section">
      <div class="section-header">
        <h4 class="section-title">
          <span nz-icon nzType="info-circle" nzTheme="outline"></span>
          Limit Details
        </h4>
        <p class="section-description">Configure CGPA and credit hour limits by scope</p>
      </div>

      <div class="form-row">
        <div class="form-col">
          <nz-form-item>
            <nz-form-control nzErrorTip="Please select a level">
              <nz-select
                formControlName="limitLevel"
                id="limitLevel"
                nzPlaceHolder=" "
                class="select-with-floating-label"
                [nzShowSearch]="true"
                [nzShowArrow]="true"
              >
                <nz-option
                  *ngFor="let item of levelList"
                  [nzValue]="item.Id"
                  [nzLabel]="item.Description"
                ></nz-option>
              </nz-select>
              <label for="limitLevel" class="floating-label">
                <span nz-icon nzType="cluster" nzTheme="outline"></span>
                Level <span class="required">*</span>
              </label>
            </nz-form-control>
          </nz-form-item>
        </div>
        <div class="form-col"></div>
      </div>

      <div class="form-row" *ngIf="isStudentLevel">
        <div class="form-col">
          <nz-form-item>
            <nz-form-control nzErrorTip="Please select a student">
              <nz-select
                formControlName="studentId"
                id="studentId"
                nzPlaceHolder=" "
                class="select-with-floating-label"
                nzShowSearch
                nzServerSearch
                [nzShowArrow]="true"
                [nzLoading]="loadingStudents"
                (nzOnSearch)="onSearchStudent($event)"
              >
                <nz-option
                  *ngFor="let item of students"
                  [nzValue]="item.id"
                  [nzLabel]="studentLabel(item)"
                ></nz-option>
              </nz-select>
              <label for="studentId" class="floating-label">
                <span nz-icon nzType="user" nzTheme="outline"></span>
                Student <span class="required">*</span>
              </label>
            </nz-form-control>
          </nz-form-item>
        </div>
      </div>

      <div class="form-row" *ngIf="isBatchLevel">
        <div class="form-col">
          <nz-form-item>
            <nz-form-control nzErrorTip="Please select a batch">
              <nz-select
                formControlName="batchCode"
                id="batchCode"
                nzPlaceHolder=" "
                class="select-with-floating-label"
                nzShowSearch
                [nzShowArrow]="true"
              >
                <nz-option
                  *ngFor="let item of batches"
                  [nzValue]="item.batchCode"
                  [nzLabel]="item.batchCode"
                ></nz-option>
              </nz-select>
              <label for="batchCode" class="floating-label">
                <span nz-icon nzType="team" nzTheme="outline"></span>
                Batch Code <span class="required">*</span>
              </label>
            </nz-form-control>
          </nz-form-item>
        </div>
      </div>

      <ng-container *ngIf="isTermLevel">
        <div class="form-row">
          <div class="form-col">
            <nz-form-item>
              <nz-form-control nzErrorTip="Please select a term">
                <nz-select
                  formControlName="academicTerm"
                  id="academicTerm"
                  nzPlaceHolder=" "
                  class="select-with-floating-label"
                  nzShowSearch
                  [nzShowArrow]="true"
                >
                  <nz-option
                    *ngFor="let item of termList"
                    [nzValue]="item.Id"
                    [nzLabel]="item.Description"
                  ></nz-option>
                </nz-select>
                <label for="academicTerm" class="floating-label">
                  <span nz-icon nzType="schedule" nzTheme="outline"></span>
                  Academic Term <span class="required">*</span>
                </label>
              </nz-form-control>
            </nz-form-item>
          </div>
          <div class="form-col">
            <nz-form-item>
              <nz-form-control nzErrorTip="Please select a year">
                <nz-select
                  formControlName="year"
                  id="year"
                  nzPlaceHolder=" "
                  class="select-with-floating-label"
                  nzShowSearch
                  [nzShowArrow]="true"
                >
                  <nz-option *ngFor="let y of yearOptions" [nzValue]="y" [nzLabel]="'' + y"></nz-option>
                </nz-select>
                <label for="year" class="floating-label">
                  <span nz-icon nzType="calendar" nzTheme="outline"></span>
                  Year <span class="required">*</span>
                </label>
              </nz-form-control>
            </nz-form-item>
          </div>
        </div>
      </ng-container>

      <div class="form-row">
        <div class="form-col">
          <nz-form-item>
            <nz-form-control nzErrorTip="Enter a value between 0 and 4">
              <input
                nz-input
                type="number"
                id="minCgpa"
                formControlName="minCgpa"
                min="0"
                max="4"
                step="0.01"
                placeholder=" "
                class="input-with-floating-label"
              />
              <label for="minCgpa" class="floating-label">
                <span nz-icon nzType="number" nzTheme="outline"></span>
                Min CGPA <span class="required">*</span>
              </label>
            </nz-form-control>
          </nz-form-item>
        </div>
        <div class="form-col">
          <nz-form-item>
            <nz-form-control nzErrorTip="Enter credit hours">
              <input
                nz-input
                type="number"
                id="maxCreditHours"
                formControlName="maxCreditHours"
                min="1"
                max="40"
                step="1"
                placeholder=" "
                class="input-with-floating-label"
              />
              <label for="maxCreditHours" class="floating-label">
                <span nz-icon nzType="clock-circle" nzTheme="outline"></span>
                Max Credit Hours <span class="required">*</span>
              </label>
            </nz-form-control>
          </nz-form-item>
        </div>
      </div>

      <div class="form-row">
        <div class="form-col">
          <div class="switch-row">
            <nz-switch formControlName="isActive"></nz-switch>
            <span class="switch-text">{{ form.get('isActive')?.value ? 'Enabled' : 'Disabled' }}</span>
          </div>
        </div>
        <div class="form-col"></div>
      </div>

      <div class="form-row">
        <div class="form-col">
          <nz-form-item>
            <nz-form-control>
              <textarea
                nz-input
                id="remark"
                formControlName="remark"
                rows="3"
                placeholder=" "
                class="textarea-with-floating-label"
              ></textarea>
              <label for="remark" class="floating-label textarea-label">
                <span nz-icon nzType="form" nzTheme="outline"></span>
                Remark
              </label>
            </nz-form-control>
          </nz-form-item>
        </div>
      </div>
    </div>
  </div>

  <div class="form-actions">
    <button nz-button nzType="default" type="button" class="cancel-btn" (click)="cancel()">
      <span nz-icon nzType="close" nzTheme="outline"></span>
      Cancel
    </button>
    <button nz-button nzType="primary" type="submit" class="submit-btn" [disabled]="form.invalid">
      <span nz-icon nzType="save" nzTheme="outline"></span>
      {{ submit }}
    </button>
  </div>
</form>
