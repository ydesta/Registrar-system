<div class="content-container">
  <div class="header-section">
    <button
      nz-button
      nzType="default"
      class="back-btn"
      type="button"
      routerLink="/colleges/entry"
    >
      <span nz-icon nzType="arrow-left" nzTheme="outline"></span>
      Back to Entries
    </button>
    <div class="header-content">
      <div class="page-title">
        <h2 class="title-text">{{ action }}</h2>
        <p class="subtitle-text">Manage entry codes and terms</p>
      </div>
    </div>
  </div>

  <div class="form-container">
    <div class="form-card">
      <div class="form-header">
        <div class="form-icon">
          <span nz-icon nzType="login" nzTheme="outline"></span>
        </div>
        <div class="form-title">
          <h3>Entry Information</h3>
          <p>Define the entry code and term</p>
        </div>
      </div>

      <form
        nz-form
        [formGroup]="entryForm"
        (ngSubmit)="submitForm()"
        class="admin-form"
      >
        <div class="form-sections">
          <div class="form-section">
            <div class="section-header">
              <h4 class="section-title">
                <span nz-icon nzType="info-circle" nzTheme="outline"></span>
                Entry Details
              </h4>
              <p class="section-description">Provide entry identification details</p>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzErrorTip="Please enter an entry code">
                    <input
                      nz-input
                      id="entryCode"
                      formControlName="entryCode"
                      placeholder=" "
                      class="input-with-floating-label"
                    />
                    <label for="entryCode" class="floating-label">
                      <span nz-icon nzType="barcode" nzTheme="outline"></span>
                      Entry Code <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>

              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzErrorTip="Please enter an entry term">
                    <input
                      nz-input
                      id="entryTerm"
                      formControlName="entryTerm"
                      placeholder=" "
                      class="input-with-floating-label"
                    />
                    <label for="entryTerm" class="floating-label">
                      <span nz-icon nzType="calendar" nzTheme="outline"></span>
                      Entry Term <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control>
                    <input
                      nz-input
                      id="remark"
                      formControlName="remark"
                      placeholder=" "
                      class="input-with-floating-label"
                    />
                    <label for="remark" class="floating-label">
                      <span nz-icon nzType="form" nzTheme="outline"></span>
                      Remark
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button
            nz-button
            nzType="default"
            class="cancel-btn"
            type="button"
            routerLink="/colleges/entry"
          >
            <span nz-icon nzType="close" nzTheme="outline"></span>
            Cancel
          </button>
          <button
            nz-button
            nzType="primary"
            class="submit-btn"
            type="submit"
            [disabled]="entryForm.invalid"
          >
            <span nz-icon nzType="save" nzTheme="outline"></span>
            {{ submit }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
