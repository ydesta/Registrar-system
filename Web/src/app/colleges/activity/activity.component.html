<div class="content-container">
  <div class="header-section">
    <div class="header-content">
      <div class="page-title">
        <h2 class="title-text">Activities</h2>
        <p class="subtitle-text">View, search, and manage all activities in the system</p>
      </div>
      <div class="header-actions">
        <div class="search-section floating-label-container">
          <input
            type="text"
            nz-input
            id="activitySearch"
            class="input-with-floating-label"
            placeholder=" "
            [(ngModel)]="pager.searchKey"
            (ngModelChange)="pager.onSearch($event)"
          />
          <label for="activitySearch" class="floating-label">
            <span nz-icon nzType="search" nzTheme="outline"></span>
            Search
          </label>
        </div>
        <button
          class="add-btn"
          nz-button
          nzType="primary"
          (click)="openModal()"
        >
          <span nz-icon nzType="plus" nzTheme="outline"></span>
          Add Activity
        </button>
      </div>
    </div>
  </div>

  <div class="table-card">
    <div id="print-section">
      <nz-table
        #basicTable
        [nzData]="activities!"
        nzBordered
        [nzPageSize]="pager.pageSize"
        [nzPageSizeOptions]="pager.pageSizeOptions"
        [nzShowSizeChanger]="true"
        [nzTotal]="pager.total"
        [nzPageIndex]="pager.pageIndex"
        (nzPageIndexChange)="pager.onPageIndexChange($event)"
        (nzPageSizeChange)="pager.onPageSizeChange($event)"
        [nzFrontPagination]="false"
        [nzShowTotal]="rangeTemplate"
        [nzLoading]="pager.loading"
        [nzNoResult]="emptyTpl"
        class="activities-table"
      >
        <ng-template #rangeTemplate let-range="range" let-total>
          <span>{{ range[0] }}-{{ range[1] }} of {{ total }} activities</span>
        </ng-template>
        <thead>
          <tr>
            <th style="min-width: 60px;">S/N</th>
            <th style="min-width: 220px;">Title</th>
            <th style="min-width: 140px;">Date</th>
            <th style="min-width: 80px; text-align: center;">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let data of basicTable.data; let i = index">
            <td><span class="sn-badge">{{ pager.serial(i) }}</span></td>
            <td>{{ data.title }}</td>
            <td>{{ data.createdDate | date: 'yyyy-MM-dd' }}</td>
            <td>
              <button
                nz-button
                nz-dropdown
                [nzDropdownMenu]="menu"
                nzPlacement="bottomRight"
                class="action-dropdown-btn"
              >
                <span nz-icon nzType="more" nzTheme="outline"></span>
              </button>
              <nz-dropdown-menu #menu="nzDropdownMenu">
                <ul nz-menu>
                  <li nz-menu-item>
                    <a class="action-menu-link" (click)="editModal(data)">
                      <span nz-icon nzType="edit" nzTheme="outline"></span>
                      <span>Edit</span>
                    </a>
                  </li>
                  <li nz-menu-item>
                    <a
                      class="action-menu-link delete"
                      (click)="showDeleteConfirm(data.id)"
                    >
                      <span nz-icon nzType="delete" nzTheme="outline"></span>
                      <span>Delete</span>
                    </a>
                  </li>
                </ul>
              </nz-dropdown-menu>
            </td>
          </tr>
        </tbody>
        <ng-template #emptyTpl>
          <div class="no-data">
            <span nz-icon nzType="calendar" nzTheme="outline"></span>
            <p>No activities available</p>
          </div>
        </ng-template>
      </nz-table>
    </div>
  </div>
</div>
