<div class="content-container">
  <div class="header-section">
    <button
      nz-button
      nzType="default"
      class="back-btn"
      type="button"
      routerLink="/colleges/academic-status"
    >
      <span nz-icon nzType="arrow-left" nzTheme="outline"></span>
      Back to Academic Status
    </button>
    <div class="header-content">
      <div class="page-title">
        <h2 class="title-text">{{ action }}</h2>
        <p class="subtitle-text">Define academic status values used across the system</p>
      </div>
    </div>
  </div>

  <div class="form-container">
    <div class="form-card">
      <div class="form-header">
        <div class="form-icon">
          <span nz-icon nzType="flag" nzTheme="outline"></span>
        </div>
        <div class="form-title">
          <h3>Academic Status Information</h3>
          <p>Enter the academic status label</p>
        </div>
      </div>

      <form
        nz-form
        [formGroup]="acadamicStatusForm"
        (ngSubmit)="submitForm()"
        class="admin-form"
      >
        <div class="form-sections">
          <div class="form-section">
            <div class="section-header">
              <h4 class="section-title">
                <span nz-icon nzType="info-circle" nzTheme="outline"></span>
                Status Details
              </h4>
              <p class="section-description">Provide the academic status name</p>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzErrorTip="Please enter an academic status">
                    <input
                      nz-input
                      id="academicStatus"
                      formControlName="academicStatus"
                      placeholder=" "
                      class="input-with-floating-label"
                    />
                    <label for="academicStatus" class="floating-label">
                      <span nz-icon nzType="flag" nzTheme="outline"></span>
                      Academic Status <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
              <div class="form-col"></div>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button
            nz-button
            nzType="default"
            class="cancel-btn"
            type="button"
            routerLink="/colleges/academic-status"
          >
            <span nz-icon nzType="close" nzTheme="outline"></span>
            Cancel
          </button>
          <button
            nz-button
            nzType="primary"
            class="submit-btn"
            type="submit"
            [disabled]="acadamicStatusForm.invalid"
          >
            <span nz-icon nzType="save" nzTheme="outline"></span>
            {{ submit }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
