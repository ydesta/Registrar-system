<div class="content-container">
  <div class="header-section">
    <button
      routerLink="../academic-term-activity"
      nz-button
      nzType="default"
      class="back-btn"
      type="button"
    >
      <span nz-icon nzType="arrow-left" nzTheme="outline"></span>
      Back to Activities
    </button>
    <div class="header-content">
      <div class="page-title">
        <h2 class="title-text">{{ action }}</h2>
        <p class="subtitle-text">Add or update academic term activity information</p>
      </div>
    </div>
  </div>

  <div class="form-container">
    <div class="form-card">
      <div class="form-header">
        <div class="form-icon">
          <span nz-icon nzType="calendar" nzTheme="outline"></span>
        </div>
        <div class="form-title">
          <h3>Academic Term Activity Information</h3>
          <p>Please fill in the activity details below</p>
        </div>
      </div>

      <form
        nz-form
        [formGroup]="acadamicTermActivityForm"
        (ngSubmit)="submitForm()"
        class="admin-form"
      >
        <div class="form-sections">
          <div class="form-section">
            <div class="section-header">
              <h4 class="section-title">
                <span nz-icon nzType="info-circle" nzTheme="outline"></span>
                Activity Details
              </h4>
              <p class="section-description">Select the academic term, activity, and date range</p>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzValidatingTip="Validating...">
                    <nz-select
                      formControlName="academicTermId"
                      id="academicTermId"
                      nzPlaceHolder=" "
                      [nzShowSearch]="true"
                      class="select-with-floating-label"
                    >
                      <nz-option
                        *ngFor="let item of academicTerms"
                        [nzValue]="item.id"
                        [nzLabel]="item.academicTerm + '-' + item.year"
                      ></nz-option>
                    </nz-select>
                    <label for="academicTermId" class="floating-label">
                      <span nz-icon nzType="calendar" nzTheme="outline"></span>
                      Academic Term <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>

              <div class="form-col">
                <nz-form-item>
                  <nz-form-control>
                    <nz-select
                      formControlName="activityID"
                      id="activityID"
                      nzPlaceHolder=" "
                      class="select-with-floating-label"
                    >
                      <nz-option
                        *ngFor="let item of activities"
                        [nzValue]="item.id"
                        [nzLabel]="item.title"
                      ></nz-option>
                    </nz-select>
                    <label for="activityID" class="floating-label">
                      <span nz-icon nzType="thunderbolt" nzTheme="outline"></span>
                      Activity <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control>
                    <nz-date-picker
                      [nzDisabledDate]="disablePastDates"
                      class="date-with-floating-label"
                      formControlName="activityStartDate"
                      id="activityStartDate"
                      nzPlaceHolder=" "
                    ></nz-date-picker>
                    <label for="activityStartDate" class="floating-label">
                      <span nz-icon nzType="calendar" nzTheme="outline"></span>
                      Activity Start Date <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>

              <div class="form-col">
                <nz-form-item>
                  <nz-form-control>
                    <nz-date-picker
                      [nzDisabledDate]="disablePastDates"
                      class="date-with-floating-label"
                      formControlName="activityEndDate"
                      id="activityEndDate"
                      nzPlaceHolder=" "
                    ></nz-date-picker>
                    <label for="activityEndDate" class="floating-label">
                      <span nz-icon nzType="calendar" nzTheme="outline"></span>
                      Activity End Date <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzErrorTip="Please input your remark!">
                    <nz-textarea-count [nzMaxCharacterCount]="250">
                      <textarea
                        id="remark"
                        rows="4"
                        formControlName="remark"
                        nz-input
                        class="textarea-with-floating-label"
                        placeholder=" "
                      ></textarea>
                    </nz-textarea-count>
                    <label for="remark" class="floating-label textarea-label">
                      <span nz-icon nzType="form" nzTheme="outline"></span>
                      Remark
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button
            nz-button
            nzType="default"
            class="cancel-btn"
            type="button"
            routerLink="../academic-term-activity"
          >
            <span nz-icon nzType="close" nzTheme="outline"></span>
            Cancel
          </button>
          <button
            nz-button
            nzType="primary"
            class="submit-btn"
            type="submit"
          >
            <span nz-icon nzType="save" nzTheme="outline"></span>
            {{ submit }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
