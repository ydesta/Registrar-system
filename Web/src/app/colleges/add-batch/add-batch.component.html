<div class="content-container">
  <div class="header-section">
    <button nz-button nzType="default" class="back-btn" type="button" (click)="goBack()">
      <span nz-icon nzType="arrow-left" nzTheme="outline"></span>
      Back to Batches
    </button>
    <div class="header-content">
      <div class="page-title">
        <h2 class="title-text">{{ action }}</h2>
        <p class="subtitle-text">Manage batch information and academic details</p>
      </div>
    </div>
  </div>

  <div class="form-container">
    <div class="form-card">
      <div class="form-header">
        <div class="form-icon">
          <span nz-icon nzType="team" nzTheme="outline"></span>
        </div>
        <div class="form-title">
          <h3>Batch Information</h3>
          <p>Fill in the required information to create a new batch</p>
        </div>
      </div>

      <form nz-form [formGroup]="batchForm" (ngSubmit)="submitForm()" class="admin-form">
        <div class="form-sections">
          <div class="form-section">
            <div class="section-header">
              <h4 class="section-title">
                <span nz-icon nzType="book" nzTheme="outline"></span>
                Academic Information
              </h4>
              <p class="section-description">Select the curriculum and academic period</p>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzErrorTip="Please select a curriculum">
                    <nz-select
                      formControlName="curriculumCode"
                      id="curriculumCode"
                      nzPlaceHolder=" "
                      class="select-with-floating-label"
                      [nzShowSearch]="true"
                      [nzAllowClear]="true"
                      [nzShowArrow]="true"
                      [nzDropdownMatchSelectWidth]="false"
                    >
                      <nz-option
                        *ngFor="let item of curricula"
                        [nzValue]="item.curriculumCode"
                        [nzLabel]="item.curriculumCode"
                      ></nz-option>
                    </nz-select>
                    <label for="curriculumCode" class="floating-label">
                      <span nz-icon nzType="book" nzTheme="outline"></span>
                      Curriculum <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>

              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzErrorTip="Please select an entry year">
                    <nz-select
                      formControlName="entryYear"
                      id="entryYear"
                      nzPlaceHolder=" "
                      class="select-with-floating-label"
                      [nzShowSearch]="true"
                      [nzShowArrow]="true"
                      [nzDropdownMatchSelectWidth]="false"
                    >
                      <nz-option
                        *ngFor="let item of yearList"
                        [nzValue]="item"
                        [nzLabel]="item.toString()"
                      ></nz-option>
                    </nz-select>
                    <label for="entryYear" class="floating-label">
                      <span nz-icon nzType="calendar" nzTheme="outline"></span>
                      Entry Year <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzErrorTip="Please select an academic term">
                    <nz-select
                      formControlName="entryTerm"
                      id="entryTerm"
                      nzPlaceHolder=" "
                      class="select-with-floating-label"
                      [nzShowSearch]="true"
                      [nzShowArrow]="true"
                      [nzDropdownMatchSelectWidth]="false"
                    >
                      <nz-option
                        *ngFor="let item of listOfTermNumber"
                        [nzValue]="item.Id"
                        [nzLabel]="item.Description"
                      ></nz-option>
                    </nz-select>
                    <label for="entryTerm" class="floating-label">
                      <span nz-icon nzType="schedule" nzTheme="outline"></span>
                      Entry Term <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>

              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzErrorTip="Please enter a amount">
                    <input
                      nz-input
                      id="amount"
                      formControlName="amount"
                      placeholder=" "
                      class="input-with-floating-label"
                    />
                    <label for="amount" class="floating-label">
                      <span nz-icon nzType="dollar" nzTheme="outline"></span>
                      Amount <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>
          </div>

          <div class="form-section">
            <div class="section-header">
              <h4 class="section-title">
                <span nz-icon nzType="tag" nzTheme="outline"></span>
                Batch Details
              </h4>
              <p class="section-description">Define the batch code and additional information</p>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzErrorTip="Please enter a batch code">
                    <input
                      nz-input
                      id="batchCode"
                      formControlName="batchCode"
                      placeholder=" "
                      class="input-with-floating-label"
                    />
                    <label for="batchCode" class="floating-label">
                      <span nz-icon nzType="barcode" nzTheme="outline"></span>
                      Batch Code <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>

              <div class="form-col">
                <nz-form-item>
                  <nz-form-control nzErrorTip="Please select an education level">
                    <nz-select
                      formControlName="educationLevel"
                      id="educationLevel"
                      nzPlaceHolder=" "
                      class="select-with-floating-label"
                      [nzShowSearch]="true"
                      [nzShowArrow]="true"
                      [nzDropdownMatchSelectWidth]="false"
                    >
                      <nz-option
                        *ngFor="let item of listOfProgramType"
                        [nzValue]="item.Id"
                        [nzLabel]="item.Description"
                      ></nz-option>
                    </nz-select>
                    <label for="educationLevel" class="floating-label">
                      <span nz-icon nzType="trophy" nzTheme="outline"></span>
                      Education Level <span class="required">*</span>
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>

            <div class="form-row">
              <div class="form-col">
                <nz-form-item>
                  <nz-form-control>
                    <nz-textarea-count [nzMaxCharacterCount]="250">
                      <textarea
                        id="remark"
                        rows="4"
                        formControlName="remark"
                        nz-input
                        placeholder=" "
                        class="textarea-with-floating-label"
                      ></textarea>
                    </nz-textarea-count>
                    <label for="remark" class="floating-label textarea-label">
                      <span nz-icon nzType="form" nzTheme="outline"></span>
                      Remark
                    </label>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button nz-button nzType="default" class="cancel-btn" type="button" (click)="goBack()">
            <span nz-icon nzType="close" nzTheme="outline"></span>
            Cancel
          </button>
          <button
            nz-button
            nzType="primary"
            class="submit-btn"
            type="submit"
            [disabled]="!batchForm.valid || loading"
            [nzLoading]="loading"
          >
            <span nz-icon nzType="save" nzTheme="outline"></span>
            {{ submit }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
